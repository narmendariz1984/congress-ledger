name: Vehicle watch

# Reads the Senate press galleries' floor logs three times a day and opens a GitHub issue
# for each bill they name as a "legislative vehicle" that data/vehicles.json doesn't list.
# Separate from the data refresh: it can't change the site or any file, and if it breaks
# nothing else does. See scripts/vehicle_watch.py.
on:
  schedule:
    - cron: "41 13 * * *"   # about 7:41 AM Central
    - cron: "41 19 * * *"   # about 1:41 PM
    - cron: "41 1 * * *"    # about 7:41 PM
  workflow_dispatch:

# Read the repo, open and close issues. Nothing else.
permissions:
  contents: read
  issues: write

concurrency:
  group: vehicle-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Check the Senate floor logs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -I scripts/vehicle_watch.py
