name: Refresh ledger data

# Runs twice an hour, at :17 and :47 (off the top of the hour, when GitHub queues are
# busiest). GitHub's scheduler is best effort and sometimes drops a run, so the second
# slot is a backup; runs never overlap (see concurrency below).
# scripts/fetch.py decides what to do from the session calendar in data/curated.json:
#   session days: votes hourly 8am-11pm CT, bills 4x a day
#   recess days:  bills once a day at 6am CT, nothing else
on:
  schedule:
    - cron: "17 * * * *"
    - cron: "47 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "full = bills and votes now, votes = votes only, auto = follow the schedule rules, backfill-dry = count a backfill, backfill = queue it"
        type: choice
        default: full
        options: [full, votes, auto, backfill-dry, backfill]
      since:
        description: "Backfill start date (YYYY-MM-DD). Blank = first day of the current Congress."
        type: string
        default: ""

# The token can read and write this repo's contents, and start this workflow again
# (used only to chain backfill batches). Nothing else.
permissions:
  contents: write
  actions: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Fetch data
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'auto' }}
          BACKFILL_SINCE: ${{ github.event_name == 'workflow_dispatch' && inputs.since || '' }}
        run: python scripts/fetch.py

      - name: Commit only if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A site/data data
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          # Changes outside site/ don't need a Cloudflare build (saves the 500/month budget)
          if git diff --cached --quiet -- site; then
            git commit -m "[CF-Pages-Skip] Update discovery state"
          else
            git commit -m "Refresh ledger data"
          fi
          # Someone may have pushed while this ran (a code change, an edit on GitHub).
          # Replay this commit on top of theirs and try again, up to 3 times.
          for i in 1 2 3; do
            if git push; then exit 0; fi
            echo "push rejected, rebasing on the latest main (try $i)"
            git pull --rebase --quiet origin main || { git rebase --abort; exit 1; }
          done
          exit 1

      # While a backfill queue remains, start the next batch now instead of waiting
      # for the schedule. Stops on its own when the queue is empty or a run fails.
      - name: Continue backfill
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          left=$(python3 -c "import json;print(len((json.load(open('data/tracked.json')).get('backfill') or {}).get('queue') or []))")
          echo "backfill queue: $left"
          if [ "$left" -gt 0 ]; then
            gh workflow run refresh.yml --ref main -f mode=auto
            echo "started the next batch"
          fi

      # Flags raw names, missing House tallies, unreadable codes and the like. Warnings
      # go to the run summary; serious problems fail the run so GitHub notifies.
      # Runs last, so the data above is already saved either way.
      - name: Check data quality
        run: node scripts/check.mjs
